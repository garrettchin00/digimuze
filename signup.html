<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Welcome to DigiMuze!">
        <title>DigiMuze - Sign Up</title>
        <meta name="author" content="Garrett Chin">
        <link rel="stylesheet" href="styles.css">
        <!-- FontAwesome for Control Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- FAVICON -->
        <link rel="icon" href="images/favicon.ico" type="image/x-icon">
        <!-- GOOGLE FONTS LINKS -->
        <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        <script src="scripts.js" defer></script>
    </head>

    <body>
        <div class="signup-container">
            <form class="signup-form">
                <h1>Sign Up for DigiMuze</h1>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Sign Up</button>

                <p>Already have an account? <a href="login.html">Login here</a>.</p>
            </form>
        </div>
    </body>
</html>
