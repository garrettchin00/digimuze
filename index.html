<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Welcome to DigiMuze!">
        <title>DigiMuze - Home of the Artist</title>
        <meta name="author" content="Garrett Chin">
        <link rel="stylesheet" href="styles.css">
        <!-- FontAwesome for Control Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- FAVICON -->
        <link rel="icon" href="images/favicon.ico" type="image/x-icon">
        <!-- GOOGLE FONTS LINKS -->
        <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        <!-- SoundCloud Widget API (required if controlling the iframe with custom buttons) -->
        <script src="https://soundcloud.com" defer></script>
        <script src="scripts.js" defer></script>
    </head>
    
    <body>
        <header>
            <div class="app-container">
                <!-- Sidebar Navigation -->
                <aside class="sidebar">
                    <h1>DigiMuze</h1>
                    <nav>
                        <ul>
                            <li><a href="index.html" class="active"><i class="fa-solid fa-house"></i> Home</a></li>
                            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
                            <li><a href="about.html"><i class="fa-solid fa-info-circle"></i> About</a></li>
                            <li><a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a></li>
                            <li><a href="login.html"><i class="fa-solid fa-user"></i> Login</a></li>
                        </ul>
                    </nav>
                </aside>
            </div>
        </header>
        <!-- Main Display Dashboard -->
            <main class="main-content">
                <div class="music-search-container">
                    <form class="search-form" action="search.html" method="get">
                        <input type="text" name="q" placeholder="Search songs, artists, or albums..." class="search-input" aria-label="Search songs, artists, or albums">
                        <button type="submit" class="search-button" aria-label="Search">
                            <i class="fa fa-search" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>

                <!-- Interactive Track List -->
                <div class="track-list" id="track-list">
                    <!-- JavaScript will dynamically render songs here -->
                </div>
            </main>

        <!-- Bottom Persistent Media Player Bar -->
        <footer class="player-bar">
            <div class="current-track-info">
                <img src="https://placehold.co" alt="Album Cover" id="player-cover">
                <div>
                    <h2 id="player-title">Select a song</h2>
                    <p id="player-artist">Artist</p>
                </div>
            </div>

            <iframe
                id="sc-widget"
                title="SoundCloud music player"
                style="width: 100%; height: 166px; border: none; overflow: hidden;"
                allow="autoplay"
                src="https://soundcloud.com">
            </iframe>

            <div class="player-controls">
                <div class="control-buttons">
                    <button type="button" id="prev-btn" aria-label="Previous track"><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
                    <button type="button" id="play-btn" class="play-main" aria-label="Play or pause"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
                    <button type="button" id="next-btn" aria-label="Next track"><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
                </div>
                
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" min="0" max="100" value="0" aria-label="Seek track progress">
                    <span id="total-duration">0:00</span>
                </div>

                <div class="volume-container">
                    <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.8" aria-label="Volume">
                </div>
            </div>
        </footer>
    </body>
</html>
