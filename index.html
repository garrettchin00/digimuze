<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Welcome to Tanaka's Amazing Commodities!">
        <title>DigiMuze</title>
        <meta name="author" content="Garrett Chin">
        <link rel="stylesheet" href="styles.css">
        <!-- FAVICON -->
        <link rel="icon" href="images/favicon.ico" type="image/x-icon">
        <!-- GOOGLE FONTS LINKS -->
        <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
        <script src="scripts.js" defer></script>
    </head>
    
    <body>
        <div class="player-container">
            <!-- Audio Element -->
            <audio id="audio-element" src="https://soundhelix.com"></audio>

            <!-- Song Info -->
            <div class="song-details">
                <div class="album-art" id="album-art" style="background-image: url('https://unsplash.com');"></div>
                <h2 id="song-title">SoundHelix Track 1</h2>
                <h3 id="artist-name">Unknown Artist</h3>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="prev-btn" class="control-btn" title="Previous"><i class="fas fa-backward"></i></button>
                <button id="play-btn" class="control-btn main-btn" title="Play"><i class="fas fa-play" id="play-icon"></i></button>
                <button id="next-btn" class="control-btn" title="Next"><i class="fas fa-forward"></i></button>
            </div>
        </div>
    </body>
</html>
